name: H2 web foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('h2-web-pr-{0}', github.event.pull_request.number) || 'h2-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Stamp deployment revision
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: >-
          node --input-type=module -e 'import { writeFileSync } from "node:fs";
          writeFileSync("dist/deployment.json", JSON.stringify({ revision: process.env.H2_REVISION }) + "\n")'
        env:
          H2_REVISION: ${{ github.sha }}
      - name: Package debug site
        if: success()
        run: tar -czf h2-debug-site.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: h2-debug-site
          path: web/h2-debug-site.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: h2-build-output
          path: web/dist
          if-no-files-found: error
      - name: Publish debug-site download instructions
        if: success()
        run: |
          {
            echo "## H2 debug build"
            echo
            echo "The built site is available in the **h2-debug-site** artifact. Download it from the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "This artifact is the exact build produced by the passing compile/unit-test job, even when the full browser suite fails."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  browser-smoke:
    needs: web-foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run required browser smoke tests
        run: npm run test:e2e -- --grep "\[smoke\]"
        env:
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-browser-smoke-evidence
          path: .harness/evidence/h2
          if-no-files-found: error

  browser-full:
    needs: web-foundation
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run full gameplay suite
        run: npm run test:e2e
        env:
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-browser-full-evidence
          path: .harness/evidence/h2
          if-no-files-found: error

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [web-foundation, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Drive the deployed world smoke path
        run: npm run test:e2e -- --grep "\[smoke\]"
        env:
          H2_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-production-browser-evidence
          path: .harness/evidence/h2
          if-no-files-found: error

  verify-production-full:
    needs: deploy-pages
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Drive the full deployed world suite
        run: npm run test:e2e
        env:
          H2_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-production-full-evidence
          path: .harness/evidence/h2
          if-no-files-found: error
