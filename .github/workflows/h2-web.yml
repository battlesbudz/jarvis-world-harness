name: H2 web foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('h2-web-pr-{0}', github.event.pull_request.number) || 'h2-pages' }}
  cancel-in-progress: false

jobs:
  web-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Stamp deployment revision
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: >-
          node --input-type=module -e 'import { writeFileSync } from "node:fs";
          writeFileSync("dist/deployment.json", JSON.stringify({ revision: process.env.H2_REVISION }) + "\n")'
        env:
          H2_REVISION: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-browser-evidence
          path: .harness/evidence/h2
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  codex-visual-playtest:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: web-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Let Codex operate the rendered world
        run: npm run test:codex-operator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          H2_REVISION: ${{ github.sha }}
      - name: Verify independent Codex evidence
        run: npm run verify:codex-operator
        env:
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-codex-operator-evidence
          path: .harness/evidence/h2/codex-operator
          if-no-files-found: error

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: web-foundation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Drive the deployed world
        run: npm run test:e2e
        env:
          H2_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          H2_REVISION: ${{ github.sha }}
      - name: Let Codex operate the deployed world
        run: npm run test:codex-operator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          H2_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          H2_REVISION: ${{ github.sha }}
      - name: Verify independent Codex evidence
        run: npm run verify:codex-operator
        env:
          H2_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-production-browser-evidence
          path: .harness/evidence/h2
          if-no-files-found: error
